spring:
  application:
    name: salary-management
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
logging:
  structured:
    format:
      console: logstash
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
app:
  security:
    csrf-cookie-secure: ${SESSION_COOKIE_SECURE:false}
    login-attempt-limit: 10
    login-attempt-window: 5m
    trusted-proxy-addresses: ${TRUSTED_PROXY_ADDRESSES:}
  bootstrap:
    hr-user:
      enabled: false
